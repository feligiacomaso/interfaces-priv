<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Game House | Juegos</title>
        <link rel="stylesheet" href="estilos.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <iframe class="header-frame" src="header.html" title="Encabezado de Game House"></iframe>
        <main>
            <section class="featured" aria-label="Juegos destacados">
                <div class="section-title">
                    <div>
                        <small>JUEGOS</small>
                        <h1>Juegos destacados</h1>
                    </div>
                    <div class="controls">
                        <button class="arrow" aria-label="Anterior"></button>
                        <button class="arrow" aria-label="Siguiente"></button>
                    </div>
                </div>
                <div class="carousel hero">
                    <div class="track"></div>
                </div>
            </section>
            <section class="game-section">
                <div class="section-title">
                    <h2>Juegos populares</h2>
                    <div class="controls">
                        <button class="arrow" aria-label="Anterior"></button>
                        <button class="arrow" aria-label="Siguiente"></button>
                    </div>
                </div>
                <div class="carousel">
                    <div class="track"></div>
                </div>
            </section>
            <section class="game-section">
                <div class="section-title">
                    <h2>Para jugar ahora</h2>
                    <div class="controls">
                        <button class="arrow" aria-label="Anterior"></button>
                        <button class="arrow" aria-label="Siguiente"></button>
                    </div>
                </div>
                <div class="carousel">
                    <div class="track"></div>
                </div>
            </section>
            <section class="game-section">
                <div class="section-title">
                    <h2>Recomendados para vos</h2>
                    <div class="controls">
                        <button class="arrow" aria-label="Anterior"></button>
                        <button class="arrow" aria-label="Siguiente"></button>
                    </div>
                </div>
                <div class="carousel">
                    <div class="track"></div>
                </div>
            </section>
        </main>
    </body>
</html>
