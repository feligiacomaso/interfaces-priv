<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="estilos.css">
</head>
<body class="header-page">
    <header class="site-header">
        <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a class="brand" href="index.html" aria-label="Game House, inicio">
            <img src="img/Logo.svg" alt="Game House" class="logo">
        </a>
        <label class="barra-busqueda">
            <input type="search" placeholder="¿Qué querés jugar?" aria-label="Buscar juegos">
            <button type="button" aria-label="Buscar">
                <img src="img/icon_buscar.svg" alt="">
            </button>
        </label>
        <button class="profile" aria-label="Perfil">
            <img src="img/icon_profile.svg" alt="">
        </button>
    </header>

    <script>
        const page = window.parent.document;
        const menuToggle = document.querySelector(".menu-toggle");
        const profileToggle = document.querySelector(".profile");
        const menuPanel = page.createElement("aside");
        const profilePanel = page.createElement("aside");

        menuPanel.className = "menu-panel";
        menuPanel.innerHTML = `
            <nav aria-label="Menú principal">
                <a href="index.html"><span class="category-icon">⌂</span>Inicio</a>
                <a href="#"><span class="category-icon">✦</span>Nuevos</a>
                <a href="#"><span class="category-icon">♛</span>Populares</a>
                <a href="#"><span class="category-icon">★</span>Favoritos</a>
                <a href="#"><span class="category-icon">◆</span>Todas las categorias</a>
                <div class="menu-divider"></div>
                <a href="#"><span class="category-icon">●</span>Accion</a>
                <a href="#"><span class="category-icon">▣</span>Arcade</a>
                <a href="#"><span class="category-icon">◉</span>Aventuras</a>
                <a href="#"><span class="category-icon">♠</span>Solitario</a>
                <a href="#"><span class="category-icon">▤</span>Cocina</a>
                <a href="#"><span class="category-icon">⚯</span>Deportes</a>
                <a href="#"><span class="category-icon">◉</span>Conducir</a>
                <a href="#"><span class="category-icon">♟</span>Estrategia</a>
                <a href="#"><span class="category-icon">☷</span>Gestion</a>
                <a href="#"><span class="category-icon">⌕</span>Objetos ocultos</a>
                <a href="#"><span class="category-icon">✚</span>Rompecabezas</a>
            </nav>`;

        profilePanel.className = "profile-panel";
        profilePanel.innerHTML = `
            <h2>Mi perfil</h2>
            <nav aria-label="Menú de perfil">
                <a href="#">Perfil</a>
                <a href="#">Favoritos</a>
                <a href="#">Wishlist</a>
                <a href="#">Configuracion</a>
                <a href="#">Cerrar sesion</a>
            </nav>`;

        page.body.append(menuPanel, profilePanel);

        menuToggle.addEventListener("click", () => {
            const isOpen = menuPanel.classList.toggle("is-open");
            menuToggle.classList.toggle("is-open", isOpen);
            menuToggle.setAttribute("aria-expanded", String(isOpen));
            menuToggle.setAttribute("aria-label", isOpen ? "Cerrar menú" : "Abrir menú");
            profilePanel.classList.remove("is-open");
        });

        profileToggle.addEventListener("click", () => {
            profilePanel.classList.toggle("is-open");
            menuPanel.classList.remove("is-open");
            menuToggle.classList.remove("is-open");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "Abrir menú");
        });

        menuPanel.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", () => {
                menuPanel.classList.remove("is-open");
                menuToggle.classList.remove("is-open");
                menuToggle.setAttribute("aria-expanded", "false");
                menuToggle.setAttribute("aria-label", "Abrir menú");
            });
        });
    </script>
</body>
</html>
